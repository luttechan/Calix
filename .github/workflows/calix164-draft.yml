name: Refresh Calix 1.6.4 draft
on:
  push:
    branches: ['codex/calix164-draft-details']
    paths: ['.github/workflows/calix164-draft.yml', '.github/tools/update_calix164_draft_assets.py']
permissions:
  contents: write
  actions: read
concurrency: calix-164-draft
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: luttechan/Calix
      SOURCE: 290d6b16663f94aef9ce8420bab1964af4cbb9ce
      RUN: '44786213395'
      ARTIFACT: '14656775462'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify Windows build and packages
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN" > run.json
          jq -e --arg sha "$SOURCE" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT" > artifact.json
          jq -e --arg sha "$SOURCE" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:97d3785ca362bd28209de654354365790fad01f799dec5b89cb732dd9752be12"' artifact.json
          gh run download "$RUN" --name Calix-1.6.4-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum --check --strict SHA256SUMS.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          with ZipFile('Calix-1.6.4-Windows-x64.zip') as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  entry = PurePosixPath(name)
                  assert entry.parts[0] == 'Calix 1.6.4'
                  assert entry.suffix.lower() not in ('.db', '.sqlite', '.sqlite3', '.har', '.dpapi', '.log'), name
                  assert entry.name not in ('settings.json', 'canvas_session.json', 'cookies.json', 'app-lock.json'), name
          PY
      - name: Update the existing draft
        run: python .github/tools/update_calix164_draft_assets.py
