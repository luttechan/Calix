name: Stage Calix 1.6.4 draft
on:
  push:
    branches: ['codex/calix164-draft']
    paths: ['.github/workflows/calix164-draft.yml']
permissions:
  contents: write
  actions: read
concurrency: calix-164-draft
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: luttechan/Calix
      SOURCE: 48375cd6e582070da0ffea1801149085b0141dfb
      RUN: '44767090558'
      ARTIFACT: '14646528824'
    steps:
      - name: Verify Windows build and packages
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN" > run.json
          jq -e --arg sha "$SOURCE" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT" > artifact.json
          jq -e --arg sha "$SOURCE" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:fff0ce6cbabadafd47ae8e9b231b58eafb2cca3bb9a7d93b24515c897fe27d91"' artifact.json
          gh run download "$RUN" --name Calix-1.6.4-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum --check --strict SHA256SUMS.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          with ZipFile('Calix-1.6.4-Windows-x64.zip') as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  entry = PurePosixPath(name)
                  assert entry.parts[0] == 'Calix 1.6.4'
                  assert entry.suffix.lower() not in ('.db', '.sqlite', '.sqlite3', '.har', '.dpapi', '.log'), name
                  assert entry.name not in ('settings.json', 'canvas_session.json', 'cookies.json', 'app-lock.json'), name
          PY
      - name: Create unpublished release draft
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          cat > notes.md <<'NOTES'
          - Dev Lab 테마 팔레트 편집 및 저장
          - 오류음과 동기화 완료음 10종. 기본음은 First Light
          - 시간표 요일과 수업 칸 정렬 수정
          NOTES
          gh release create v1.6.4 --target "$SOURCE" --draft --title 'Calix 1.6.4' --notes-file notes.md \
            packages/Calix-1.6.4-Setup-x64.exe packages/Calix-1.6.4-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.6.4 --json databaseId --jq .databaseId)
          gh api "repos/$GH_REPO/releases/$release_id" > release.json
          jq -e --arg sha "$SOURCE" '.draft and .tag_name == "v1.6.4" and .target_commitish == $sha and (.assets | length == 3)' release.json
          for file in packages/*; do
            hash=$(sha256sum "$file" | cut -d ' ' -f 1)
            jq -e --arg name "$(basename "$file")" --arg hash "sha256:$hash" 'any(.assets[]; .name == $name and .digest == $hash)' release.json
          done
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$latest"
          jq -r .html_url release.json
