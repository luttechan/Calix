name: Publish Calix 1.6.0
on:
  push:
    branches: ['codex/calix160r4-publish']
    paths: ['.github/workflows/publish160r4.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-160r4
  cancel-in-progress: false
jobs:
  verify-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify Setup finish launch and Windows names
        shell: pwsh
        run: |
          gh run download 43057127185 --repo luttechan/Calix --name Calix-1.6.0-development-Windows-x64 --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Setup download failed' }
          $setup = Resolve-Path packages/Calix-1.6.0-Setup-x64.exe
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -cne 'f1e690b88571b6b851fbd1323e3e0d59f3888a1e42e4ec917facd655028c29ae') { throw 'Setup hash mismatch' }
          python .github/tools/check_calix160_finish.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup finish launch verification failed' }
  publish:
    needs: verify-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 3179e2fb52445190d859d8beb3018a9c99c816ba
      BUILD: 53b002f1dc5d40c414167467b84954e558eb8313
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/43057127185 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13872566823 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:65ba210e1c384a0ac68e7597642e5ffb9355e67a08ece374a039829e3acef149"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 43057127185 --repo luttechan/Calix --name Calix-1.6.0-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo 'f1e690b88571b6b851fbd1323e3e0d59f3888a1e42e4ec917facd655028c29ae  Calix-1.6.0-Setup-x64.exe' | sha256sum --check --strict
          echo '3e7bd9b7e1f4a82a37c62ba5504007a1eda4953a0e9362a16b894f815ba35dad  Calix-1.6.0-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.6.0 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - 학기별 학점 계산기 (4.5 / 4.3 / 4.0)
          - 비밀번호와 저장 DB 암호화
          - 메인 화면 자동 잠금, 시간표와 학점 메뉴 잠금
          - 숫자 입력 오류 수정
          - 글자 크기, 행간과 화면별 텍스트 표시 개선
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.6.0' -f sha="$SOURCE" > tag.json
          gh release create v1.6.0 --repo luttechan/Calix --verify-tag --title 'Calix 1.6.0' --notes-file notes.md --draft \
            packages/Calix-1.6.0-Setup-x64.exe packages/Calix-1.6.0-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.6.0 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.6.0" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.0-Setup-x64.exe" and .digest == "sha256:f1e690b88571b6b851fbd1323e3e0d59f3888a1e42e4ec917facd655028c29ae")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.0-Windows-x64.zip" and .digest == "sha256:3e7bd9b7e1f4a82a37c62ba5504007a1eda4953a0e9362a16b894f815ba35dad")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.6.0"' published.json
