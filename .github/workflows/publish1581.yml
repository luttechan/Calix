name: Publish Calix 1.5.81
on:
  push:
    branches: ['codex/calix1581-publish']
    paths: ['.github/workflows/publish1581.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-1581
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: e059a08c0316a6511057ccf5891f98335cf1759c
      BUILD: e059a08c0316a6511057ccf5891f98335cf1759c
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/41398028107 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13120597604 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:15d6c767ce8611b5efe523d20b8380c047b8f724883080c9fce70a2ff5e9d5bd"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41398028107 --repo luttechan/Calix --name Calix-1.5.81-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo 'b1497c12b081ce5a1db0590c68ac351704d7b444feff7a3f4a9ffda8429b2ff6  Calix-1.5.81-Setup-x64.exe' | sha256sum --check --strict
          echo '126b17b58445ed76abbaacfe1294b2213fd188a3607dc35fc3f9a62a8cf17468  Calix-1.5.81-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Canvas 모듈 일정 수집과 조회 시간 제한
          - 시작 시 업데이트 알림
          - 영어 Dev 메뉴와 진단 도구 6종
          - Lutein Studio 크레딧과 실행 파일 정보
          NOTES
          gh release create v1.5.81 --repo luttechan/Calix --target "$SOURCE" --title 'Calix 1.5.81' --notes-file notes.md --draft packages/Calix-1.5.81-Setup-x64.exe packages/Calix-1.5.81-Windows-x64.zip packages/SHA256SUMS.txt
          gh release view v1.5.81 --repo luttechan/Calix --json assets > published.json
          jq -e '.assets | length == 3' published.json
          gh release edit v1.5.81 --repo luttechan/Calix --draft=false --latest
