name: Publish Calix 1.5.94
on:
  push:
    branches: ['codex/calix1594r3-publish']
    paths: ['.github/workflows/publish1594r3.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-1594r3
  cancel-in-progress: false
jobs:
  verify-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify Setup finish launch and Windows names
        shell: pwsh
        run: |
          gh run download 41876153024 --repo luttechan/Calix --name Calix-1.5.94-development-Windows-x64 --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Setup download failed' }
          $setup = Resolve-Path packages/Calix-1.5.94-Setup-x64.exe
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -cne '725032e462cfd57de5ee1138ae806dc32620e489b3c74fa64a010f0ed2691dfb') { throw 'Setup hash mismatch' }
          python .github/tools/check_calix1594_finish.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup finish launch verification failed' }
  publish:
    needs: verify-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 355b3936427567a7287cf449bff4594cec068ba7
      BUILD: 9c47a33e92d007d0e80a67a7a8c2ea0024aeccea
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/41876153024 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13346664007 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:f42f64032754826548d66a6070a92effd7870709714f656e6bbda6a76d41a899"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41876153024 --repo luttechan/Calix --name Calix-1.5.94-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo '725032e462cfd57de5ee1138ae806dc32620e489b3c74fa64a010f0ed2691dfb  Calix-1.5.94-Setup-x64.exe' | sha256sum --check --strict
          echo 'f8a4f35993ccb7378ccae225ca499694192574f0a6f9f48df81ef2891803d736  Calix-1.5.94-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.5.94 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - 설치 완료 및 앱 내 업데이트 후 자동 실행
          - 작업표시줄과 앱 이름에 현재 버전 표시
          - Dev Lab 추가
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.5.94' -f sha="$SOURCE" > tag.json
          gh release create v1.5.94 --repo luttechan/Calix --verify-tag --title 'Calix 1.5.94' --notes-file notes.md --draft \
            packages/Calix-1.5.94-Setup-x64.exe packages/Calix-1.5.94-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.5.94 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.5.94" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.5.94-Setup-x64.exe" and .digest == "sha256:725032e462cfd57de5ee1138ae806dc32620e489b3c74fa64a010f0ed2691dfb")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.5.94-Windows-x64.zip" and .digest == "sha256:f8a4f35993ccb7378ccae225ca499694192574f0a6f9f48df81ef2891803d736")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.5.94"' published.json
