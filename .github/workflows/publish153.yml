name: Publish Calix 1.5.3
on:
  push:
    branches: ['codex/calix153-publish']
    paths: ['.github/workflows/publish153.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-153
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 7eb786db3db5bdbdb747d48f8e90c3e1fb65cb4f
      BUILD: 7eb786db3db5bdbdb747d48f8e90c3e1fb65cb4f
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/41299374481 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13080084523 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:261bed5724cfe5d8e77bd6430f8d76af06636dddc664c22d60722f92c22a860e"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41299374481 --repo luttechan/Calix --name Calix-1.5.3-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo 'af3f17e7d22a1fe76b31f4a42d1a73b628929daa1c97be7c6064f76c86748a30  Calix-1.5.3-Setup-x64.exe' | sha256sum --check --strict
          echo '395df5b77d01da56b8889c787ec2784a430259c3ae1e46c4b88aece503005024  Calix-1.5.3-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - ReadyStream을 포함한 학교 플레이어 21개 영상 유형 인식
          - API 재생 정보로 새 유형 판별, 미확인 자료의 빈 목록 처리 방지
          - 동기화 중단, 개발자 콘솔 강제 재동기화 및 실행 중 로그 활성화
          NOTES
          gh release create v1.5.3 --repo luttechan/Calix --target "$SOURCE" --title 'Calix 1.5.3' --notes-file notes.md --draft packages/Calix-1.5.3-Setup-x64.exe packages/Calix-1.5.3-Windows-x64.zip packages/SHA256SUMS.txt
          gh release view v1.5.3 --repo luttechan/Calix --json assets > published.json
          jq -e '.assets | length == 3' published.json
          gh release edit v1.5.3 --repo luttechan/Calix --draft=false --latest
