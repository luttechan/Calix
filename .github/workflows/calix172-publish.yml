name: Publish Calix 1.7.2
on:
  push:
    branches: ['codex/calix172-publish']
    paths: ['.github/workflows/calix172-publish.yml']
permissions:
  contents: write
  actions: read
concurrency: calix-172-publish
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: luttechan/Calix
      SOURCE: 762ae7dc7da713e8daa981381e905814091c4605
      RUN: '44866303384'
      ARTIFACT: '14692850424'
    steps:
      - name: Verify Windows build and packages
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN" > run.json
          jq -e --arg sha "$SOURCE" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT" > artifact.json
          jq -e --arg sha "$SOURCE" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:46c4d111ce265bd433a9295f63c631be70b9a0510e2d6f95bb465688d74eab68"' artifact.json
          gh run download "$RUN" --name Calix-1.7.2-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum --check --strict SHA256SUMS.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          with ZipFile('Calix-1.7.2-Windows-x64.zip') as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  entry = PurePosixPath(name)
                  assert entry.parts[0] == 'Calix 1.7.2'
                  assert entry.suffix.lower() not in ('.db', '.sqlite', '.sqlite3', '.har', '.dpapi', '.log'), name
                  assert entry.name not in ('settings.json', 'canvas_session.json', 'cookies.json', 'app-lock.json'), name
          PY
      - name: Publish Calix 1.7.2
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = '40037550cbd279b831289d4bd082fc2913c43c7d'
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = 'v1.7.1'
          if gh api "repos/$GH_REPO/git/ref/tags/v1.7.2" > /dev/null 2>&1; then
            echo 'The version tag already exists.' >&2
            exit 1
          fi
          cd packages
          cat > notes.md <<'NOTES'
          - 학기 자동 전환과 Canvas 과목 이동
          - Anki 덱 현황 단방향 연동
          - 시간표 시간 선택과 한글 입력 개선

          [사용 설명서](https://luttechan.github.io/calix/guide/)
          NOTES
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v1.7.2' -f sha="$SOURCE" > tag.json
          jq -e --arg sha "$SOURCE" '.object.sha == $sha' tag.json
          gh release create v1.7.2 --verify-tag --draft --title 'Calix 1.7.2' --notes-file notes.md Calix-1.7.2-Setup-x64.exe Calix-1.7.2-Windows-x64.zip SHA256SUMS.txt
          release_id=$(gh release view v1.7.2 --json databaseId --jq .databaseId)
          gh api "repos/$GH_REPO/releases/$release_id" > draft.json
          jq -e '.draft and .tag_name == "v1.7.2" and (.assets | length == 3)' draft.json
          for file in Calix-1.7.2-Setup-x64.exe Calix-1.7.2-Windows-x64.zip SHA256SUMS.txt; do
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            jq -e --arg name "$file" --arg digest "sha256:$digest" 'any(.assets[]; .name == $name and .digest == $digest)' draft.json
          done
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '(.draft == false) and (.prerelease == false) and .tag_name == "v1.7.2"' published.json
          jq -r .html_url published.json
