name: Publish Calix 1.6.11
on:
  push:
    branches: ['codex/calix1611-publish']
    paths: ['.github/workflows/publish161.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-161
  cancel-in-progress: false
jobs:
  verify-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify Setup finish launch and Windows names
        shell: pwsh
        run: |
          gh run download 43133154277 --repo luttechan/Calix --name Calix-1.6.11-development-Windows-x64 --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Setup download failed' }
          $setup = Resolve-Path packages/Calix-1.6.11-Setup-x64.exe
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -cne 'd1a0989181ed3bdeaef0a3576bc5948fe7b302990609343f8cc6d3c10de59acd') { throw 'Setup hash mismatch' }
          python .github/tools/check_calix1611_finish.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup finish launch verification failed' }
  publish:
    needs: verify-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: fa4051a6c0aa967f91caf41ba3d778717c03de3a
      BUILD: 07162709d585178bff9af8230c5d0a795f3bc172
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/43133154277 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13906747142 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:c56ddb52b92aeb8cdd33b2d95ccada833e56d1fefd343f5e2274c051f3b08da2"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 43133154277 --repo luttechan/Calix --name Calix-1.6.11-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo 'd1a0989181ed3bdeaef0a3576bc5948fe7b302990609343f8cc6d3c10de59acd  Calix-1.6.11-Setup-x64.exe' | sha256sum --check --strict
          echo '7d25d23b3f63929466822284253ddc2e17a2a1b8ec40f55013d696d085333ea6  Calix-1.6.11-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.6.11 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - 불필요한 안내 문구 정리
          - 뽀모도로 집중 문구와 완료 문구 설정
          - 집중 완료 알림 누락 개선
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.6.11' -f sha="$SOURCE" > tag.json
          gh release create v1.6.11 --repo luttechan/Calix --verify-tag --title 'Calix 1.6.11' --notes-file notes.md --draft \
            packages/Calix-1.6.11-Setup-x64.exe packages/Calix-1.6.11-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.6.11 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.6.11" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.11-Setup-x64.exe" and .digest == "sha256:d1a0989181ed3bdeaef0a3576bc5948fe7b302990609343f8cc6d3c10de59acd")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.11-Windows-x64.zip" and .digest == "sha256:7d25d23b3f63929466822284253ddc2e17a2a1b8ec40f55013d696d085333ea6")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.6.11"' published.json
