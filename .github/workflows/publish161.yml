name: Publish Calix 1.6.30
on:
  push:
    branches: ['codex/calix1630-publish']
    paths: ['.github/workflows/publish161.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-161
  cancel-in-progress: false
jobs:
  verify-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify Setup finish launch and Windows names
        shell: pwsh
        run: |
          gh run download 44731625289 --repo luttechan/Calix --name Calix-1.6.30-development-Windows-x64 --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Setup download failed' }
          $setup = Resolve-Path packages/Calix-1.6.30-Setup-x64.exe
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -cne '3a2b2259e38caed8353b471ac77fb9470d00c6ba4c7dd120a5825d8199264f0f') { throw 'Setup hash mismatch' }
          python .github/tools/check_calix1630_finish.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup finish launch verification failed' }
  publish:
    needs: verify-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: a7c22ea991da4b84c51665124c3e52cdccb57903
      BUILD: 6864302591197a4909676d27a7b84ed3f3f8ce87
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/44731625289 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/14627102070 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:7a6839472ff1733d213ea4f8b20364f933b67c2097d7597b239da3238af3d3ee"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 44731625289 --repo luttechan/Calix --name Calix-1.6.30-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo '3a2b2259e38caed8353b471ac77fb9470d00c6ba4c7dd120a5825d8199264f0f  Calix-1.6.30-Setup-x64.exe' | sha256sum --check --strict
          echo '31db5a8062ad7d68d85e54841ea4690e3e4c78b5c5cda5246f28d00c9187b853  Calix-1.6.30-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.6.30 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - 마감 보드·과목별 현황, 학습 계획과 공강 찾기
          - 시간표 개선 및 테마 4종 추가
          - 공결·결석 분리 표시, 이전 버전 정리 옵션과 작업 표시줄 바로가기 교체
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.6.30' -f sha="$SOURCE" > tag.json
          gh release create v1.6.30 --repo luttechan/Calix --verify-tag --title 'Calix 1.6.30' --notes-file notes.md --draft \
            packages/Calix-1.6.30-Setup-x64.exe packages/Calix-1.6.30-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.6.30 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.6.30" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.30-Setup-x64.exe" and .digest == "sha256:3a2b2259e38caed8353b471ac77fb9470d00c6ba4c7dd120a5825d8199264f0f")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.30-Windows-x64.zip" and .digest == "sha256:31db5a8062ad7d68d85e54841ea4690e3e4c78b5c5cda5246f28d00c9187b853")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.6.30"' published.json
