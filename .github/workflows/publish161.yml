name: Publish Calix 1.6.12
on:
  push:
    branches: ['codex/calix1612-publish']
    paths: ['.github/workflows/publish161.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-161
  cancel-in-progress: false
jobs:
  verify-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify Setup finish launch and Windows names
        shell: pwsh
        run: |
          gh run download 43138938751 --repo luttechan/Calix --name Calix-1.6.12-development-Windows-x64 --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Setup download failed' }
          $setup = Resolve-Path packages/Calix-1.6.12-Setup-x64.exe
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -cne '5e01a664f018fe36ba2e9ac6dcb675534c3f5040c287c8205cd12faa151b30d0') { throw 'Setup hash mismatch' }
          python .github/tools/check_calix1612_finish.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup finish launch verification failed' }
  publish:
    needs: verify-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 9a713b5f691a2208c95b241c6fc3df4cf4fdeb50
      BUILD: 8d52fab177dfe7d59e14399665c84bd5015fbb19
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/43138938751 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13908509019 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:d726a57cf16db355fed29c69ea4073665599bdf48257a9ad563bd2f20b7948cb"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 43138938751 --repo luttechan/Calix --name Calix-1.6.12-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo '5e01a664f018fe36ba2e9ac6dcb675534c3f5040c287c8205cd12faa151b30d0  Calix-1.6.12-Setup-x64.exe' | sha256sum --check --strict
          echo '63e40a8741aa8a3f61c4f72a2e1fd89e0d48450a1eeaa4841a61bdcd2499d777  Calix-1.6.12-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.6.12 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - 전원 버튼 옆에 화면 잠금 추가
          - 비밀번호 설정 화면과 스크롤 수정
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.6.12' -f sha="$SOURCE" > tag.json
          gh release create v1.6.12 --repo luttechan/Calix --verify-tag --title 'Calix 1.6.12' --notes-file notes.md --draft \
            packages/Calix-1.6.12-Setup-x64.exe packages/Calix-1.6.12-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.6.12 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.6.12" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.12-Setup-x64.exe" and .digest == "sha256:5e01a664f018fe36ba2e9ac6dcb675534c3f5040c287c8205cd12faa151b30d0")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.12-Windows-x64.zip" and .digest == "sha256:63e40a8741aa8a3f61c4f72a2e1fd89e0d48450a1eeaa4841a61bdcd2499d777")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.6.12"' published.json
