name: Publish Calix 1.6.20
on:
  push:
    branches: ['codex/calix1620-publish']
    paths: ['.github/workflows/publish161.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-161
  cancel-in-progress: false
jobs:
  verify-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify Setup finish launch and Windows names
        shell: pwsh
        run: |
          gh run download 44094094268 --repo luttechan/Calix --name Calix-1.6.20-development-Windows-x64 --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Setup download failed' }
          $setup = Resolve-Path packages/Calix-1.6.20-Setup-x64.exe
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -cne 'c3b17fdd4a3d766fa2dae2613822cb37fc6ee5fe7f0ee720986cef021c2b56b9') { throw 'Setup hash mismatch' }
          python .github/tools/check_calix1620_finish.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup finish launch verification failed' }
  publish:
    needs: verify-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: b6de93c6f8eff0d4e6c9e9690448792bf00f3f53
      BUILD: 948ec658f41c93a2cea56dcf6027adaf9ac9ded7
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/44094094268 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/14332914214 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:c41b4ecd225a8dba7942057dbe763815c01b8cf7d77ff448e704423959ce1c0c"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 44094094268 --repo luttechan/Calix --name Calix-1.6.20-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo 'c3b17fdd4a3d766fa2dae2613822cb37fc6ee5fe7f0ee720986cef021c2b56b9  Calix-1.6.20-Setup-x64.exe' | sha256sum --check --strict
          echo '2e7b4e74e76833f838cfdac2d9bd497611ef3968e63a0a942f58ddc56cba4ecb  Calix-1.6.20-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.6.20 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - 로그인 후 자동 동기화, 로그인 전 동기화 안내
          - 바깥 클릭으로 열린 창이 닫히는 동작 수정
          - 일정 추가·동기화·잠금·메뉴 이동 단축키와 안내창
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.6.20' -f sha="$SOURCE" > tag.json
          gh release create v1.6.20 --repo luttechan/Calix --verify-tag --title 'Calix 1.6.20' --notes-file notes.md --draft \
            packages/Calix-1.6.20-Setup-x64.exe packages/Calix-1.6.20-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.6.20 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.6.20" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.20-Setup-x64.exe" and .digest == "sha256:c3b17fdd4a3d766fa2dae2613822cb37fc6ee5fe7f0ee720986cef021c2b56b9")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.20-Windows-x64.zip" and .digest == "sha256:2e7b4e74e76833f838cfdac2d9bd497611ef3968e63a0a942f58ddc56cba4ecb")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.6.20"' published.json
