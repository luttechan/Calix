name: Publish Calix 1.6.1
on:
  push:
    branches: ['codex/calix161-publish']
    paths: ['.github/workflows/publish161.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-161
  cancel-in-progress: false
jobs:
  verify-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify Setup finish launch and Windows names
        shell: pwsh
        run: |
          gh run download 43065613240 --repo luttechan/Calix --name Calix-1.6.1-development-Windows-x64 --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Setup download failed' }
          $setup = Resolve-Path packages/Calix-1.6.1-Setup-x64.exe
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -cne '6971775cba1cc5357e96ed5868bdcde92e17e78524c338d7c5b08cf5a4b65045') { throw 'Setup hash mismatch' }
          python .github/tools/check_calix161_finish.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup finish launch verification failed' }
  publish:
    needs: verify-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 81d086ff24145128e0b409c294b148fd817c29ca
      BUILD: 464ae7aa2e995618cdc64fb82b171113fe82c54e
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/43065613240 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13878405621 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:180e9a0ebba68e9c61ebcbbd808a5021c0489eb80948ea580dd384130e867673"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 43065613240 --repo luttechan/Calix --name Calix-1.6.1-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo '6971775cba1cc5357e96ed5868bdcde92e17e78524c338d7c5b08cf5a4b65045  Calix-1.6.1-Setup-x64.exe' | sha256sum --check --strict
          echo 'cf798de55b9a2bfc0951f68ca0490aca9b3c5970f2cd7c1a75ad1a2fac3d8d9e  Calix-1.6.1-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.6.1 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - 학점 화면 정렬과 좁은 창의 입력 항목 배치 수정
          - 학점 메뉴 사용 전 비밀번호 설정 필수
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.6.1' -f sha="$SOURCE" > tag.json
          gh release create v1.6.1 --repo luttechan/Calix --verify-tag --title 'Calix 1.6.1' --notes-file notes.md --draft \
            packages/Calix-1.6.1-Setup-x64.exe packages/Calix-1.6.1-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.6.1 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.6.1" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.1-Setup-x64.exe" and .digest == "sha256:6971775cba1cc5357e96ed5868bdcde92e17e78524c338d7c5b08cf5a4b65045")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.1-Windows-x64.zip" and .digest == "sha256:cf798de55b9a2bfc0951f68ca0490aca9b3c5970f2cd7c1a75ad1a2fac3d8d9e")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.6.1"' published.json
