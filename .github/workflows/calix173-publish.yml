name: Publish Calix 1.7.3
on:
  push:
    branches: ['codex/calix173-publish']
    paths: ['.github/workflows/calix173-publish.yml']
permissions:
  contents: write
  actions: read
concurrency: calix-173-publish
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: luttechan/Calix
      SOURCE: d38395305058f4ba6432466483311d711520e365
      RUN: '44871727175'
      ARTIFACT: '14694810916'
    steps:
      - name: Verify Windows build and packages
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN" > run.json
          jq -e --arg sha "$SOURCE" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT" > artifact.json
          jq -e --arg sha "$SOURCE" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:aa0281ffb30f79c6786ac41b09187f8d70fd86541d22b020734ea95d37636d76"' artifact.json
          gh run download "$RUN" --name Calix-1.7.3-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum --check --strict SHA256SUMS.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          with ZipFile('Calix-1.7.3-Windows-x64.zip') as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  entry = PurePosixPath(name)
                  assert entry.parts[0] == 'Calix 1.7.3'
                  assert entry.suffix.lower() not in ('.db', '.sqlite', '.sqlite3', '.har', '.dpapi', '.log'), name
                  assert entry.name not in ('settings.json', 'canvas_session.json', 'cookies.json', 'app-lock.json'), name
          PY
      - name: Publish Calix 1.7.3
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = '762ae7dc7da713e8daa981381e905814091c4605'
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = 'v1.7.2'
          if gh api "repos/$GH_REPO/git/ref/tags/v1.7.3" > /dev/null 2>&1; then
            echo 'The version tag already exists.' >&2
            exit 1
          fi
          cd packages
          cat > notes.md <<'NOTES'
          - 홈에서 메인 학기 수동 변경
          - Anki 덱 집계 오류 수정
          - 별도 Calix Console과 잠금 해제음
          - 창 크기에 맞춰 넓어지는 설정 화면

          [사용 설명서](https://luttechan.github.io/calix/guide/)
          NOTES
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v1.7.3' -f sha="$SOURCE" > tag.json
          jq -e --arg sha "$SOURCE" '.object.sha == $sha' tag.json
          gh release create v1.7.3 --verify-tag --draft --title 'Calix 1.7.3' --notes-file notes.md Calix-1.7.3-Setup-x64.exe Calix-1.7.3-Windows-x64.zip SHA256SUMS.txt
          release_id=$(gh release view v1.7.3 --json databaseId --jq .databaseId)
          gh api "repos/$GH_REPO/releases/$release_id" > draft.json
          jq -e '.draft and .tag_name == "v1.7.3" and (.assets | length == 3)' draft.json
          for file in Calix-1.7.3-Setup-x64.exe Calix-1.7.3-Windows-x64.zip SHA256SUMS.txt; do
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            jq -e --arg name "$file" --arg digest "sha256:$digest" 'any(.assets[]; .name == $name and .digest == $digest)' draft.json
          done
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '(.draft == false) and (.prerelease == false) and .tag_name == "v1.7.3"' published.json
          jq -r .html_url published.json
