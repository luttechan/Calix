name: Publish Calix 1.7.4
on:
  push:
    branches: ['codex/calix174-publish']
    paths: ['.github/workflows/calix174-publish.yml']
permissions:
  contents: write
  actions: read
concurrency: calix-174-publish
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: luttechan/Calix
      SOURCE: b548b1659d838042ea56bc51de73dd47f42ad75c
      RUN: '44910713121'
      ARTIFACT: '14709738886'
    steps:
      - name: Verify Windows build and packages
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN" > run.json
          jq -e --arg sha "$SOURCE" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT" > artifact.json
          jq -e --arg sha "$SOURCE" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:eb8e4a95500a06d482253a358a5d15c9028b69947c1079d543cfff8bb1833594"' artifact.json
          gh run download "$RUN" --name Calix-1.7.4-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum --check --strict SHA256SUMS.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          with ZipFile('Calix-1.7.4-Windows-x64.zip') as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  entry = PurePosixPath(name)
                  assert entry.parts[0] == 'Calix 1.7.4'
                  assert entry.suffix.lower() not in ('.db', '.sqlite', '.sqlite3', '.har', '.dpapi', '.log'), name
                  assert entry.name not in ('settings.json', 'canvas_session.json', 'cookies.json', 'app-lock.json'), name
          PY
      - name: Publish Calix 1.7.4
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = 'd38395305058f4ba6432466483311d711520e365'
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = 'v1.7.3'
          if gh api "repos/$GH_REPO/git/ref/tags/v1.7.4" > /dev/null 2>&1; then
            echo 'The version tag already exists.' >&2
            exit 1
          fi
          cd packages
          cat > notes.md <<'NOTES'
          - 시간표 비대면 수업 영역 겹침 수정
          - 화면 전환 모션, 설정에서 모션 줄이기
          - 학습 화면에 ANV 2.1 연결 상태와 최근 Anki 동기화 표시
          - 잠금 화면에서 종료 가능


          [사용 설명서](https://luttechan.github.io/calix/guide/)
          NOTES
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v1.7.4' -f sha="$SOURCE" > tag.json
          jq -e --arg sha "$SOURCE" '.object.sha == $sha' tag.json
          gh release create v1.7.4 --verify-tag --draft --title 'Calix 1.7.4' --notes-file notes.md Calix-1.7.4-Setup-x64.exe Calix-1.7.4-Windows-x64.zip SHA256SUMS.txt
          release_id=$(gh release view v1.7.4 --json databaseId --jq .databaseId)
          gh api "repos/$GH_REPO/releases/$release_id" > draft.json
          jq -e '.draft and .tag_name == "v1.7.4" and (.assets | length == 3)' draft.json
          for file in Calix-1.7.4-Setup-x64.exe Calix-1.7.4-Windows-x64.zip SHA256SUMS.txt; do
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            jq -e --arg name "$file" --arg digest "sha256:$digest" 'any(.assets[]; .name == $name and .digest == $digest)' draft.json
          done
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '(.draft == false) and (.prerelease == false) and .tag_name == "v1.7.4"' published.json
          jq -r .html_url published.json
