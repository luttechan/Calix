name: Publish Calix 1.5.91
on:
  push:
    branches: ['codex/calix1591-publish']
    paths: ['.github/workflows/publish1591.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-1591
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 13941e5c5fd89a2569970797dc03a16d60260658
      BUILD: a2d597d6c68e29b4c0423b28ea1c75591c32120e
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/41572058725 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13202222844 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:212dbc3109b6779aea3c6b527b811370608c4a51747bd221b653b4724214a9e3"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41572058725 --repo luttechan/Calix --name Calix-1.5.91-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo '2aca48130948ad60cec5b67b28652b74ab40921cbc3257fb8b02ba23b84af32a  Calix-1.5.91-Setup-x64.exe' | sha256sum --check --strict
          echo 'bb4213c66f1602e17ebf4eb8593880b6c7acf6f80b48112f2a0bf38c6ec55f6d  Calix-1.5.91-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.5.91 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - 출결을 최대 3개 과목씩 병렬 조회
          - 출결 메뉴 표시와 동기화 개별 설정. 기본값은 모두 꺼짐
          - 동기화 예상 남은 시간 표시
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.5.91' -f sha="$SOURCE" > tag.json
          gh release create v1.5.91 --repo luttechan/Calix --verify-tag --title 'Calix 1.5.91' --notes-file notes.md --draft \
            packages/Calix-1.5.91-Setup-x64.exe packages/Calix-1.5.91-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.5.91 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.5.91" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.5.91-Setup-x64.exe" and .digest == "sha256:2aca48130948ad60cec5b67b28652b74ab40921cbc3257fb8b02ba23b84af32a")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.5.91-Windows-x64.zip" and .digest == "sha256:bb4213c66f1602e17ebf4eb8593880b6c7acf6f80b48112f2a0bf38c6ec55f6d")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.5.91"' published.json
