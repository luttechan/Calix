name: Publish Calix 1.6.32
on:
  push:
    branches: ['codex/calix1632-publish']
    paths: ['.github/workflows/publish1632.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-1632
  cancel-in-progress: false
jobs:
  verify-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify Setup finish launch and Windows names
        shell: pwsh
        run: |
          gh run download 44745041052 --repo luttechan/Calix --name Calix-1.6.32-development-Windows-x64 --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Setup download failed' }
          $setup = Resolve-Path packages/Calix-1.6.32-Setup-x64.exe
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -cne '3956364a26c0ea147aaf1730f7f97655430784911f64d5c683f51292ae5d1dfc') { throw 'Setup hash mismatch' }
          python .github/tools/check_calix1632_finish.py $setup
          if ($LASTEXITCODE -ne 0) { throw 'Setup finish launch verification failed' }
  publish:
    needs: verify-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 04d28fa9efbb45b24fa79b6606d485257a9d22b1
      BUILD: 04d28fa9efbb45b24fa79b6606d485257a9d22b1
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/44745041052 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/14632549682 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:e6489afbca4cad14937984da03d68f00eb96dc52e4329f4caf46e0c876b23e9e"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 44745041052 --repo luttechan/Calix --name Calix-1.6.32-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo '3956364a26c0ea147aaf1730f7f97655430784911f64d5c683f51292ae5d1dfc  Calix-1.6.32-Setup-x64.exe' | sha256sum --check --strict
          echo '245d2279f3f3f74ef2bb575f81299b8792087d8a90a894b5e0e683db9b2a7d61  Calix-1.6.32-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.6.32 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - Canvas 출결 현황 기준으로 공결 표시
          - 마감 보드, 시간표, 달력 레이아웃 수정
          - 체크박스와 스위치 디자인 통일

          [사용 설명서](https://luttechan.github.io/calix/guide/)
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.6.32' -f sha="$SOURCE" > tag.json
          gh release create v1.6.32 --repo luttechan/Calix --verify-tag --title 'Calix 1.6.32' --notes-file notes.md --draft \
            packages/Calix-1.6.32-Setup-x64.exe packages/Calix-1.6.32-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.6.32 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.6.32" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.32-Setup-x64.exe" and .digest == "sha256:3956364a26c0ea147aaf1730f7f97655430784911f64d5c683f51292ae5d1dfc")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.6.32-Windows-x64.zip" and .digest == "sha256:245d2279f3f3f74ef2bb575f81299b8792087d8a90a894b5e0e683db9b2a7d61")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.6.32"' published.json
