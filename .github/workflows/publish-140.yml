name: Publish Calix 1.4.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-140.yml']
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = '160da2ece1d20d81c0b5c4be006ba121c0440c58'
          $changed = git diff --name-only $source $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0 -or @($changed | Where-Object { -not $_.StartsWith('.github/workflows/') }).Count) { throw 'Runtime source differs from validated build.' }
          foreach ($check in @(@{id=41077970943;sha=$source},@{id=41081892570;sha='904ab2e19b3b59053d471669400739ee03e53a9c'})) {
            $run = gh api "repos/luttechan/Calix/actions/runs/$($check.id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $check.sha) { throw 'Build or installer validation failed.' }
          }
          gh run download 41077970943 --repo luttechan/Calix --name Calix-1.4.0-development-Windows-x64 --dir packages
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed.' }
          $hashes = @{
            'Calix-1.4.0-Windows-x64.zip'='9815a94abefff324d538aafad2e191dcb57e7dd8594ad3d76b96886f0518698b'
            'Calix-1.4.0-Setup-x64.exe'='23dd454fada20fc1e97f936bc49fc1760f1f6ddecc3e8de7dd51aa71942eedf6'
          }
          foreach ($name in $hashes.Keys) {
            if ((Get-FileHash -LiteralPath (Join-Path packages $name)).Hash.ToLowerInvariant() -ne $hashes[$name]) { throw 'Artifact digest mismatch.' }
          }
          $files = Get-ChildItem packages -File | ForEach-Object FullName
          gh release create v1.4.0 --repo luttechan/Calix --target $env:GITHUB_SHA --title 'Calix 1.4.0' --notes-file desktop/RELEASE.md --latest @files
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
