name: Publish Calix 1.5.0
on:
  push:
    branches: ['codex/calix150-publish']
    paths: ['.github/workflows/publish150.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-150
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: c01be37967f764784af37bf5f78786c4e7616b76
      BUILD: c01be37967f764784af37bf5f78786c4e7616b76
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/41288622086 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13076606120 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:7d918110a49212d8a7310d08eb678d1215e31814592dd573f6b7fb143222095d"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41288622086 --repo luttechan/Calix --name Calix-1.5.0-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo 'b1fdc7edfc26a8f8334254fb4bc31e72aa508f8a5297fd0ef927c1b36c62ca84  Calix-1.5.0-Setup-x64.exe' | sha256sum --check --strict
          echo '602bbb7292ba943ce9790a327059a16dfdd12ff0dbd70ae0b1eb504d2647262a  Calix-1.5.0-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - 비대면 수업 하단 영역 추가
          - 수업 직접 추가, 이름과 시간 편집
          - 과제와 영상 상태 필터 추가
          - 사용자 닉네임과 프로필 사진 설정
          - 앱 버전 표시 및 개발자 콘솔 접근 개선
          NOTES
          gh release create v1.5.0 --repo luttechan/Calix --target "$SOURCE" --title 'Calix 1.5.0' --notes-file notes.md --draft packages/Calix-1.5.0-Setup-x64.exe packages/Calix-1.5.0-Windows-x64.zip packages/SHA256SUMS.txt
          gh release view v1.5.0 --repo luttechan/Calix --json assets > published.json
          jq -e '.assets | length == 3' published.json
          gh release edit v1.5.0 --repo luttechan/Calix --draft=false --latest
