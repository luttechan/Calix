name: Publish Calix 1.7.1
on:
  push:
    branches: ['codex/calix171-publish']
    paths: ['.github/workflows/calix171-publish.yml']
permissions:
  contents: write
  actions: read
concurrency: calix-171-publish
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: luttechan/Calix
      SOURCE: 40037550cbd279b831289d4bd082fc2913c43c7d
      RUN: '44805318374'
      ARTIFACT: '14664441653'
    steps:
      - name: Verify Windows build and packages
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN" > run.json
          jq -e --arg sha "$SOURCE" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT" > artifact.json
          jq -e --arg sha "$SOURCE" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:e0c6dfbf0bc0671b4fc86961ef4cadeaa18d7689dadc537dd79304792a8af824"' artifact.json
          gh run download "$RUN" --name Calix-1.7.1-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum --check --strict SHA256SUMS.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          with ZipFile('Calix-1.7.1-Windows-x64.zip') as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  entry = PurePosixPath(name)
                  assert entry.parts[0] == 'Calix 1.7.1'
                  assert entry.suffix.lower() not in ('.db', '.sqlite', '.sqlite3', '.har', '.dpapi', '.log'), name
                  assert entry.name not in ('settings.json', 'canvas_session.json', 'cookies.json', 'app-lock.json'), name
          PY
      - name: Publish Calix 1.7.1
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/v1.7.1" > /dev/null 2>&1; then
            echo 'The version tag already exists.' >&2
            exit 1
          fi
          cd packages
          cat > notes.md <<'NOTES'
          - 설정 탭의 아이콘과 이름을 한 줄로 배치
          - 창 너비에 따른 탭 정렬과 선택 표시 개선

          [사용 설명서](https://luttechan.github.io/calix/guide/)
          NOTES
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v1.7.1' -f sha="$SOURCE" > tag.json
          jq -e --arg sha "$SOURCE" '.object.sha == $sha' tag.json
          gh release create v1.7.1 --verify-tag --draft --title 'Calix 1.7.1' --notes-file notes.md Calix-1.7.1-Setup-x64.exe Calix-1.7.1-Windows-x64.zip SHA256SUMS.txt
          release_id=$(gh release view v1.7.1 --json databaseId --jq .databaseId)
          gh api "repos/$GH_REPO/releases/$release_id" > draft.json
          jq -e '.draft and .tag_name == "v1.7.1" and (.assets | length == 3)' draft.json
          for file in Calix-1.7.1-Setup-x64.exe Calix-1.7.1-Windows-x64.zip SHA256SUMS.txt; do
            digest=$(sha256sum "$file" | cut -d ' ' -f 1)
            jq -e --arg name "$file" --arg digest "sha256:$digest" 'any(.assets[]; .name == $name and .digest == $digest)' draft.json
          done
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '(.draft == false) and (.prerelease == false) and .tag_name == "v1.7.1"' published.json
          jq -r .html_url published.json
