name: Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'learning_calendar/**'
      - 'asset/**'
      - 'tests/**'
      - 'tools/**'
      - 'main.py'
      - 'Calix.spec'
      - 'requirements*.txt'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: calix-windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Check release runtime
        run: python tools/check_runtime_security.py
      - name: Install build dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-build.txt'
      - name: Generate runtime assets
        run: python -B tools/prepare_assets.py
      - name: Check application
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests -p no:cacheprovider
      - name: Check portable CPU paths
        env:
          QT_QPA_PLATFORM: offscreen
          QT_NO_CPU_FEATURE: aes avx avx2 avx512bitalg avx512bw avx512cd avx512dq avx512f avx512fp16 avx512ifma avx512vbmi avx512vbmi2 avx512vl avx512vpopcntdq avxifma bmi bmi2 f16c fma gfni sha sse3 sse4.1 sse4.2 ssse3 vaes
          OPENSSL_ia32cap: '0:0:0:0:0'
        run: python -m pytest -q tests/test_diary_manual.py tests/test_secret_pending.py tests/test_autofill_guard.py tests/test_italic_faces.py tests/test_ready_dialogs.py -p no:cacheprovider
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean Calix.spec
      - name: Verify embedded code and bundle size
        run: python tools/check_bundle.py 'dist/Calix 1.1.0'
      - name: Check packaged UI and browser
        env:
          QT_QPA_PLATFORM: offscreen
          QT_NO_CPU_FEATURE: aes avx avx2 avx512bitalg avx512bw avx512cd avx512dq avx512f avx512fp16 avx512ifma avx512vbmi avx512vbmi2 avx512vl avx512vpopcntdq avx512vl avxifma bmi bmi2 f16c fma gfni sha sse3 sse4.1 sse4.2 ssse3 vaes
          OPENSSL_ia32cap: '0:0:0:0:0'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Get-Location) 'dist/Calix 1.1.0/Calix.exe'
          foreach ($mode in @('smoke-test','browser-check')) {
            $report = Join-Path $env:RUNNER_TEMP "calix-$mode.json"
            $process = Start-Process -FilePath $exe -ArgumentList @("--$mode",$report) -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "$mode timed out." }
            if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw "$mode failed." }
            $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if ($mode -eq 'browser-check') {
              if (-not $result.passed -or $result.qt_tls_backend -ne 'schannel') { throw 'Browser validation failed.' }
            } else {
              $checks = @('font_loaded','font_has_hangul','tls_context_ready','crypto_roundtrip','assignment_list_matches_snapshot','movie_list_matches_snapshot','calendar_filters_isolated','special_birthday_available','special_options_labels','calendar_nov29_overlay_matches','compact_calendar_chips','calendar_full_width_default','home_available','timetable_available','credits_available','diary_available','vault_crypto_ready','login_available')
              foreach ($check in $checks) { if ($result.$check -ne $true) { throw "UI check failed: $check" } }
              if ($result.tls_library -notmatch '^OpenSSL 3[.]5[.]9 ') { throw 'Unexpected TLS runtime.' }
            }
            Get-Content -LiteralPath $report -Raw
          }
      - name: Measure packaged menu response
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'calix-navigation.json'
          $exe = Join-Path (Get-Location) 'dist/Calix 1.1.0/Calix.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--navigation-check',$report) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Menu check timed out.' }
          if ($process.ExitCode -notin @(0,1) -or -not (Test-Path -LiteralPath $report)) { throw 'Menu check failed.' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.samples.Count -ne 13) { throw 'Navigation sequence incomplete.' }
          foreach ($sample in $result.samples) {
            if ($sample.error -or $sample.page -ne $sample.selected -or $sample.click_to_paint_ms -ge 1000) { throw 'Navigation regression.' }
          }
          if (-not $result.passed) { Write-Warning '50 ms target was not reached on this hosted runner.' }
          Get-Content -LiteralPath $report -Raw
      - name: Package runtime only
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'calix-release'
          python tools/package_release.py 'dist/Calix 1.1.0' $output
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          if ((Get-Item -LiteralPath (Join-Path $output 'Calix-1.1.0-Windows-x64.zip')).Length -ge 200MB) { throw 'Unexpected archive size.' }
      - name: Build and verify installer
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          $package = Join-Path $env:RUNNER_TEMP 'calix-release'
          $bundle = Join-Path (Get-Location) 'dist/Calix 1.1.0'
          & $compiler "/DBundleDir=$bundle" "/DOutputDir=$package" 'tools/Calix-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          $setup = Join-Path $package 'Calix-1.1.0-Setup-x64.exe'
          python tools/check_installer.py $setup $bundle (Join-Path $env:RUNNER_TEMP 'calix-install-check')
          if ($LASTEXITCODE -ne 0) { throw 'Installer validation failed.' }
          $digest = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath (Join-Path $package 'SHA256SUMS.txt') -Value "$digest  Calix-1.1.0-Setup-x64.exe" -Encoding utf8
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Calix Release v.1.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'calix-release'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v1.1.0" -Headers $headers
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          if ($null -ne $existing) {
            if ($existing.target_commitish -eq $env:GITHUB_SHA) { exit 0 }
            throw 'This revision already exists. Do not move the old tag.'
          }
          gh release create v1.1.0 (Join-Path $package 'Calix-1.1.0-Windows-x64.zip') (Join-Path $package 'Calix-1.1.0-Setup-x64.exe') (Join-Path $package 'SHA256SUMS.txt') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Calix 1.1' --notes '주차학습 화면 기반 영상 수집으로 변경. 시청 상태와 학습 기간 반영, 기존 일정 메모 유지.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
