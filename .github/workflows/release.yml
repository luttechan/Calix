name: Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Calix 1.0.7/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: calix-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'Calix 1.0.7/source/requirements-build.txt'
      - name: Install build dependencies
        working-directory: Calix 1.0.7/source
        run: python -m pip install -r requirements-build.txt
      - name: Check application
        working-directory: Calix 1.0.7/source
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests -p no:cacheprovider
      - name: Build Windows application
        working-directory: Calix 1.0.7/source
        run: python -m PyInstaller --noconfirm --clean Calix.spec
      - name: Package Calix
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'calix-release'
          $version = Join-Path $destination 'Calix 1.0.7'
          New-Item -ItemType Directory -Path $version | Out-Null
          Copy-Item -LiteralPath 'Calix 1.0.7/source/dist/Calix-1.0.7' -Destination (Join-Path $version 'app') -Recurse
          & robocopy 'Calix 1.0.7/source' (Join-Path $version 'source') /E /XJ /XD build dist __pycache__ .pytest_cache .venv /XF *.pyc /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -gt 7) { throw 'Source copy failed.' }
          Copy-Item -LiteralPath 'Calix 1.0.7/run_windows.bat' -Destination $version
          Copy-Item -LiteralPath 'README.md','LICENSE' -Destination $version
          Push-Location $destination
          tar -a -c -f Calix-1.0.7-Windows-x64.zip 'Calix 1.0.7'
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed.' }
          $hash = (Get-FileHash -LiteralPath Calix-1.0.7-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Calix-1.0.7-Windows-x64.zip" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8NoBOM
          Pop-Location
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'calix-release'
          gh release create v1.0.7 (Join-Path $package 'Calix-1.0.7-Windows-x64.zip') (Join-Path $package 'SHA256SUMS.txt') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Calix 1.0.7' --notes-file 'release-notes.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
