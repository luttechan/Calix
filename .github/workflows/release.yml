name: Finalize approved Calix 1.0.7 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
permissions:
  contents: write
jobs:
  release:
    if: github.event.head_commit.message == 'Finalize approved Calix 1.0.7 release notes once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Update release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.7 --repo luttechan/Calix --notes-file release-notes.md --latest
