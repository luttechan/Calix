name: Publish Calix 1.5.93
on:
  push:
    branches: ['codex/calix1593-publish']
    paths: ['.github/workflows/publish1593.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-calix-1593
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: bbbe3f86fb150b04d767972156e8c4c7f5a449ad
      BUILD: a0a209f01e4ced65d82d20d669242316b53a8f50
    steps:
      - name: Verify source and validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/luttechan/Calix/git/ref/heads/main --jq .object.sha)" = "$SOURCE"
          test "$(gh api repos/luttechan/Calix/git/commits/$SOURCE --jq .tree.sha)" = "$(gh api repos/luttechan/Calix/git/commits/$BUILD --jq .tree.sha)"
          gh api repos/luttechan/Calix/actions/runs/41849615590 > run.json
          jq -e --arg sha "$BUILD" '.conclusion == "success" and .head_sha == $sha and .head_repository.full_name == "luttechan/Calix"' run.json
          gh api repos/luttechan/Calix/actions/artifacts/13335426897 > artifact.json
          jq -e --arg sha "$BUILD" '.expired == false and .workflow_run.head_sha == $sha and .digest == "sha256:c10c2b29c3992b3b7afd46b87a1eb0bc1fddd30cfad2995618a17e8b6f99ef5d"' artifact.json
      - name: Download and verify packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41849615590 --repo luttechan/Calix --name Calix-1.5.93-development-Windows-x64 --dir packages
          cd packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          echo 'e51450a14c628b830e6bf222e3bf74a4c0fceb5aeb8d53cfaf800aa56cac6002  Calix-1.5.93-Setup-x64.exe' | sha256sum --check --strict
          echo 'c32cdbb0505c45afe94d7c42c9b1c9d6ababe38cb518e277a79ac8a716908c24  Calix-1.5.93-Windows-x64.zip' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/luttechan/Calix/releases/tags/v1.5.93 >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          - 오버레이에 현재 버전 표시
          - 기존 버전 삭제 시 이전 엔진 파일 정리
          NOTES
          gh api -X POST repos/luttechan/Calix/git/refs -f ref='refs/tags/v1.5.93' -f sha="$SOURCE" > tag.json
          gh release create v1.5.93 --repo luttechan/Calix --verify-tag --title 'Calix 1.5.93' --notes-file notes.md --draft \
            packages/Calix-1.5.93-Setup-x64.exe packages/Calix-1.5.93-Windows-x64.zip packages/SHA256SUMS.txt
          release_id=$(gh release view v1.5.93 --repo luttechan/Calix --json databaseId --jq .databaseId)
          gh api "repos/luttechan/Calix/releases/$release_id" > release.json
          jq -e '.draft and .tag_name == "v1.5.93" and (.assets | length == 3)' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.5.93-Setup-x64.exe" and .digest == "sha256:e51450a14c628b830e6bf222e3bf74a4c0fceb5aeb8d53cfaf800aa56cac6002")' release.json
          jq -e 'any(.assets[]; .name == "Calix-1.5.93-Windows-x64.zip" and .digest == "sha256:c32cdbb0505c45afe94d7c42c9b1c9d6ababe38cb518e277a79ac8a716908c24")' release.json
          gh api -X PATCH "repos/luttechan/Calix/releases/$release_id" -F draft=false -f make_latest=true > published.json
          jq -e '.draft == false and .tag_name == "v1.5.93"' published.json
